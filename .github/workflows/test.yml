name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

env:
  FORCE_COLOR: 2
  NODE_COV: 24 # The Node.js version to run coveralls on

jobs:
  test:
    name: Node ${{ matrix.node }} - ${{ matrix.architecture }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write # needed by coverallsapp/github-action to post check run status

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        java: [25]
        architecture: [x64]
        include:
          - os: macos-latest
            node: 24
            java: 25
            architecture: x64
          - os: windows-latest
            node: 24
            java: 25
            architecture: x64
          - os: windows-latest
            node: 22
            java: 17
            architecture: x86

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture }}
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "temurin"
          architecture: ${{ matrix.architecture }}
          java-version: ${{ matrix.java }}

      - name: Install npm dependencies
        run: npm ci

      - name: Run full tests
        run: npm run test:coverage
        if: "!startsWith(matrix.os, 'windows')"

      - name: Run tests
        run: npm run mocha
        if: startsWith(matrix.os, 'windows')

      - name: Run Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        if: startsWith(matrix.os, 'ubuntu') && matrix.node == env.NODE_COV
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
