name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

env:
  FORCE_COLOR: 2
  NODE_COV: 24 # The Node.js version to run coveralls on

jobs:
  test:
    name: Node ${{ matrix.node }} - ${{ matrix.architecture }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write # needed by coverallsapp/github-action to post check run status

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        java: [25]
        architecture: [x64]
        include:
          - os: macos-latest
            node: 24
            java: 25
            architecture: x64
          - os: windows-latest
            node: 24
            java: 25
            architecture: x64
          - os: windows-latest
            node: 22
            java: 17
            architecture: x86

    steps:
      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture }}
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: "temurin"
          architecture: ${{ matrix.architecture }}
          java-version: ${{ matrix.java }}

      - name: Install npm dependencies
        run: npm ci

      - name: Run full tests
        run: npm run test:coverage
        if: "!startsWith(matrix.os, 'windows')"

      - name: Run tests
        run: npm run mocha
        if: startsWith(matrix.os, 'windows')

      - name: Run Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        if: startsWith(matrix.os, 'ubuntu') && matrix.node == env.NODE_COV
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
